<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MRI2MR WebUI</title>
    <link rel="stylesheet" href="/static/style.css?v=webui-v3-20260629-1" />
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/build/three.module.js",
          "three/addons/": "/static/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <section class="case-panel" aria-label="病例管理">
          <div class="section-head">
            <div class="brand">
              <strong>MRI2MR</strong>
              <span id="connectionStatus">启动中</span>
            </div>
            <div class="case-actions">
              <button id="refreshPatientsButton" type="button">刷新病人</button>
              <button id="savePatientButton" type="button">保存病人</button>
              <button id="newPatientButton" type="button">新建病人</button>
            </div>
          </div>

          <div class="patient-grid">
            <label class="span-2">
              已有病人
              <select id="patientSelect">
                <option value="">新建病人</option>
              </select>
            </label>
            <label>
              病人姓名
              <input id="patientName" autocomplete="off" />
            </label>
            <label>
              病人 ID
              <input id="patientId" autocomplete="off" />
            </label>
            <label>
              性别
              <select id="patientSex">
                <option value="">未填写</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label>
              年龄
              <input id="patientAge" type="number" min="0" step="1" autocomplete="off" />
            </label>
            <label>
              检查日期
              <input id="studyDate" type="date" />
            </label>
            <label class="span-2">
              备注
              <input id="patientNotes" autocomplete="off" />
            </label>
            <div class="folder-row span-2">
              <span>病例文件夹</span>
              <strong id="patientFolder">workspace\unknown</strong>
            </div>
          </div>
        </section>

        <section class="progress-panel" aria-label="处理进度">
          <div class="section-head">
            <strong>处理进度</strong>
            <div class="run-actions">
              <button id="runButton" class="primary" type="button">运行</button>
              <button id="cancelButton" type="button" disabled>取消</button>
            </div>
          </div>

          <div class="progress-grid">
            <div>
              <span>状态</span>
              <strong id="jobStatus">未运行</strong>
            </div>
            <div>
              <span>阶段</span>
              <strong id="jobStage">等待任务</strong>
            </div>
            <div>
              <span>已用时间</span>
              <strong id="elapsedTime">0秒</strong>
            </div>
            <div>
              <span>预估剩余</span>
              <strong id="remainingTime">估算中</strong>
            </div>
          </div>
          <div id="runtimeStatus" class="runtime-grid" aria-label="运行环境状态"></div>
          <div class="progress-track" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressBar"></div>
          </div>
          <div class="progress-foot">
            <span id="progressValue">0%</span>
            <span id="activePatientHint">当前病人输出会在右侧刷新</span>
          </div>
          <div id="jobError" class="error-line"></div>
        </section>
      </header>

      <section class="workspace">
        <aside class="left-panel">
          <div class="panel-header">
            <div>
              <strong>参数配置</strong>
              <div id="modeDescription" class="subtle"></div>
            </div>
            <label>
              模式
              <select id="modeSelect"></select>
            </label>
          </div>
          <form id="parameterForm"></form>
        </aside>

        <div id="leftWorkspaceResizer" class="workspace-splitter" role="separator" aria-orientation="vertical"></div>

        <section class="preview-panel">
          <div class="preview-toolbar">
            <div>
              <strong id="previewTitle">预览</strong>
              <span id="previewMeta"></span>
            </div>
            <button id="resetViewButton" type="button" disabled>重置视角</button>
          </div>
          <div id="previewStage" class="preview-stage">
            <div class="empty-state">等待结果</div>
          </div>
        </section>

        <div id="rightWorkspaceResizer" class="workspace-splitter" role="separator" aria-orientation="vertical"></div>

        <aside class="right-panel">
          <section class="output-summary">
            <div>
              <strong>当前病人输出</strong>
              <span id="outputsMeta">尚未选择病人</span>
            </div>
            <span id="outputCount">0 个文件</span>
          </section>

          <section class="glb-tools">
            <div class="list-title">
              <span>GLB 组合</span>
              <span id="glbSelectionCount">未选择</span>
            </div>
            <div class="tool-row">
              <button id="selectAllGlbButton" type="button">全选 GLB</button>
              <button id="loadSelectedGlbButton" type="button" disabled>加载选中模型</button>
              <button id="clearGlbButton" type="button" disabled>清空组合</button>
            </div>
            <div id="modelPresetList" class="model-preset-list"></div>
            <div id="modelLayerList" class="model-layer-list"></div>
          </section>

          <section class="output-box">
            <div class="list-title">
              <span>输出文件</span>
              <span id="outputSource">病人结果</span>
            </div>
            <div id="outputsList" class="outputs-list"></div>
          </section>
        </aside>
      </section>

      <section class="log-panel">
        <div class="log-header">
          <strong>运行日志</strong>
          <span id="logSize"></span>
        </div>
        <pre id="logView"></pre>
      </section>
    </main>

    <script type="module" src="/static/app.js?v=webui-v3-20260629-1"></script>
  </body>
</html>
